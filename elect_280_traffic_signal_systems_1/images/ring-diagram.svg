<text x="425" y="252" font-family="DejaVu Sans, Arial, sans-serif" font-size="13" text-anchor="middle" fill="#1d1d1d">Barrier: both rings must reach it and cross it together</text>

<text x="40" y="280" font-family="DejaVu Sans, Arial, sans-serif" font-size="14" font-weight="bold">Read it like this</text>
<text x="40" y="302" font-family="DejaVu Sans, Arial, sans-serif" font-size="13" fill="#222">• Time runs left to right. Phases in the same ring never time together.</text>
<text x="40" y="322" font-family="DejaVu Sans, Arial, sans-serif" font-size="13" fill="#222">• One phase from each ring times at once: 1+5, 1+6, 2+5, 2+6 on the left; 3+7, 3+8, 4+7, 4+8 on the right.</text>
<text x="40" y="342" font-family="DejaVu Sans, Arial, sans-serif" font-size="13" fill="#222">• Odd phases are protected left turns; even phases are throughs. A ped phase runs with its parallel through.</text>
<text x="40" y="362" font-family="DejaVu Sans, Arial, sans-serif" font-size="13" fill="#222">• Each phase ends with its yellow change interval, then its red clearance.</text>
<rect x="300" y="268" width="14" height="14" fill="#3a9d4a" stroke="#1d1d1d"/><text x="320" y="280" font-family="DejaVu Sans, Arial, sans-serif" font-size="13">green</text>
<rect x="390" y="268" width="14" height="14" fill="#f2c230" stroke="#1d1d1d"/><text x="410" y="280" font-family="DejaVu Sans, Arial, sans-serif" font-size="13">yellow change</text>
<rect x="525" y="268" width="14" height="14" fill="#d6453d" stroke="#1d1d1d"/><text x="545" y="280" font-family="DejaVu Sans, Arial, sans-serif" font-size="13">red clearance</text>
</svg>