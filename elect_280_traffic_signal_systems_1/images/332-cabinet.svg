<text x="30" y="478" font-family="DejaVu Sans, Arial, sans-serif" font-size="13" fill="#222">• Service panel: utility/BBS terminal block (TBS), main breaker, surge filter, clean AC to the electronics.</text>
<text x="30" y="498" font-family="DejaVu Sans, Arial, sans-serif" font-size="13" fill="#222">• Police panel (behind the small door): Signals ON/OFF and AUTO/FLASH switches.</text>
<text x="30" y="518" font-family="DejaVu Sans, Arial, sans-serif" font-size="13" fill="#222">• Input panel: terminal blocks where loop lead-ins (DLC) and push-button wires land.</text>
<text x="30" y="538" font-family="DejaVu Sans, Arial, sans-serif" font-size="13" fill="#222">• Field terminals: where the 12CSC conductors to the signal heads land.</text>
